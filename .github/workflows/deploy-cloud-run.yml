name: deploy-cloud-run-mvp

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: physical-ai-guardian
  GCP_REGION: ${{ vars.GCP_REGION || 'asia-northeast1' }}
  CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE || 'disaster-agentic-mvp' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: cloud-run-mvp
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment configuration
        shell: bash
        run: |
          test -n "${{ secrets.GCP_WIF_PROVIDER }}" || { echo "Missing GCP_WIF_PROVIDER"; exit 1; }
          test -n "${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}" || { echo "Missing GCP_DEPLOY_SERVICE_ACCOUNT"; exit 1; }

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      # The same script as a Cloud Shell deploy: the public service account (no Vertex AI
      # permission), the env vars and the smoke checks. Live Gemini stays off unless the
      # operator turns it on (LIVE_AI_ENABLED=1) from Cloud Shell.
      - name: Deploy with scripts/deploy_cloud_run_mvp.sh (live AI off)
        shell: bash
        env:
          LIVE_AI_ENABLED: "0"
        run: ./scripts/deploy_cloud_run_mvp.sh
