name: capture-submission-images

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'data/**'
      - 'scripts/capture_submission.py'
      - '.github/workflows/capture-submission.yml'
  pull_request:
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'data/**'
      - 'scripts/capture_submission.py'
      - '.github/workflows/capture-submission.yml'
  workflow_dispatch:
    inputs:
      source:
        description: '画像取得先（local＝CI内部、cloudrun＝公開Cloud Run）'
        type: choice
        required: true
        default: local
        options: [local, cloudrun]
      expected_revision:
        description: 'cloudrun実行時に必須の公開サービスの短いリビジョン識別子'
        type: string
        required: false

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install app and screenshot dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install 'uvicorn>=0.34,<1' 'playwright>=1.55,<2'
          python -m playwright install --with-deps chromium
      - name: Start synthetic demo API
        if: github.event_name != 'workflow_dispatch' || inputs.source != 'cloudrun'
        run: |
          python -m uvicorn apps.api.main:app --host 127.0.0.1 --port 8000 \
            > /tmp/evacweave-api.log 2>&1 &
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              echo 'MVP ready'
              exit 0
            fi
            sleep 1
          done
          cat /tmp/evacweave-api.log
          exit 1
      - name: Capture 12 actual UI images (10 slides, play page, architecture diagram)
        env:
          CAPTURE_SOURCE: ${{ inputs.source || 'local' }}
          EXPECTED_REVISION: ${{ inputs.expected_revision || '' }}
        run: |
          if [[ "$CAPTURE_SOURCE" == "cloudrun" ]]; then
            if [[ -z "$EXPECTED_REVISION" ]]; then
              echo "Cloud Run capture requires expected_revision to prevent stale screenshots" >&2
              exit 2
            fi
            URL="https://disaster-agentic-mvp-571915385983.asia-northeast1.run.app"
          else
            URL="http://127.0.0.1:8000"
            EXPECTED_REVISION="dev"
          fi
          python scripts/capture_submission.py \
            --base-url "$URL" \
            --expected-revision "$EXPECTED_REVISION" \
            --out artifacts/submission/images
          test "$(find artifacts/submission/images -name '*.png' | wc -l)" -eq 12
          test -s artifacts/submission/images/architecture-diagram.png
      - uses: actions/upload-artifact@v4
        with:
          name: evacweave-submission-images
          path: artifacts/submission/images/
          if-no-files-found: error
          retention-days: 30
