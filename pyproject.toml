[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "evacweave"
version = "0.5.0"
description = "EvacWeave: a deterministic Simulation Core judges synthetic evacuation plans; Vertex AI Gemini is the policy of a guarded agent loop"
requires-python = ">=3.12,<3.14"
dependencies = ["pydantic==2.13.4"]

[project.optional-dependencies]
test = ["pytest==9.0.2"]

[tool.setuptools.packages.find]
include = ["apps*", "packages*"]

[tool.setuptools.package-data]
"packages.prompts" = ["**/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = ["training"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "C4", "SIM", "RUF", "PT", "PLW1510"]
# Full-width Japanese punctuation in UI/log strings is intentional.
ignore = ["RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "S603", "S607", "PT011", "PT018"]
"scripts/**" = ["S603", "S607"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "packages"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["apps", "packages", "scripts"]
# Not installed where mypy runs (CI): torch/transformers/peft (imported lazily by the GPU
# runtime), google.* (google-genai and google-auth, imported lazily by the Vertex transport
# and the ID-token helper in packages/) and playwright (scripts/capture_submission.py).
[[tool.mypy.overrides]]
module = ["torch", "transformers", "peft", "google", "google.*", "playwright.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[tool.coverage.run]
source = ["apps", "packages"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
